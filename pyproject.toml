[project]
name = "clamp"
version = "0.1.0"
description = "PeptideCLM-2 transfer learning for membrane permeabilization (HC50/MIC) prediction"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "rdkit>=2023.9",
    "p2smi>=1.1.1",
    "typer>=0.12",
    "tqdm>=4.66",
    "qmap-benchmark>=0.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "hypothesis>=6.100",
    "ruff>=0.4",
]

[project.scripts]
clamp-data = "clamp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clamp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
